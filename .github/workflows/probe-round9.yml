name: Probe round 9 - Travelpayouts Hotel-Endpunkte finden

# Runde 8 hat alle bekannten Hotel-Pfade mit Token probiert: nginx-404,
# S3-403, Go-404. Das sah nach "Programm nicht freigeschaltet" aus - aber
# 404 ist die Antwort eines Servers auf einen *Pfad*, nicht auf eine
# fehlende Berechtigung. Eine fehlende Freischaltung antwortet mit 401/403
# und einer JSON-Begruendung.
#
# Diese Runde trennt die beiden Faelle sauber:
#   - Kontrolle: der Flugpfad, von dem wir wissen, dass Token+Konto gehen.
#     Antwortet der mit 200, ist das Konto in Ordnung und jedes 404 daneben
#     liegt am Pfad, nicht an der Freischaltung.
#   - Breite Suche nach dem Pfad, den die Hotel-API heute hat.
#
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hotel-Endpunkte suchen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ.get("TRAVELPAYOUTS_TOKEN", "")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def call(name, url, headers=None, show=260):
              hdrs = {"User-Agent": UA, "Accept": "application/json"}
              hdrs.update(headers or {})
              req = urllib.request.Request(url, headers=hdrs)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode("utf-8", "replace")
                      print(f"  {r.status:>3}  {name}")
                      print(f"       {text[:show]}".replace("\n", " "))
                      return r.status, text
              except urllib.error.HTTPError as e:
                  body = e.read()[:show].decode("utf-8", "replace").replace("\n", " ")
                  # Das ist die entscheidende Unterscheidung: JSON-Fehler =
                  # Pfad lebt, Rechte fehlen. HTML/nginx = Pfad weg.
                  kind = "JSON-Fehler (Pfad lebt!)" if body.strip().startswith("{") else "Pfad weg"
                  print(f"  {e.code:>3}  {name}   [{kind}]")
                  print(f"       {body}")
                  return e.code, body
              except Exception as e:
                  print(f"  ---  {name}   FEHLER {type(e).__name__}: {e}")
              return None, None

          print("=== KONTROLLE: der Flugpfad, der nachweislich funktioniert ===")
          call("Fluege v3 prices_for_dates",
               "https://api.travelpayouts.com/aviasales/v3/prices_for_dates?"
               + urllib.parse.urlencode({"origin": "BER", "destination": "BCN",
                                          "currency": "eur", "limit": 1}),
               headers={"X-Access-Token": TOKEN})

          print("\n=== HOTELS: Pfadsuche, Token als Header UND als Parameter ===")
          # marker fehlte in Runde 8 komplett. Ohne echte Partner-ID kann
          # nur gemessen werden, OB der Parameter ueberhaupt verlangt wird -
          # eine Antwort "marker required" waere der Beweis, dass der Pfad
          # lebt und uns nur die ID fehlt.
          candidates = [
              ("engine cache.json",
               "https://engine.hotellook.com/api/v2/cache.json?location=Berlin&currency=eur"
               "&checkIn=2026-09-15&checkOut=2026-09-18&limit=3"),
              ("engine cache.json + marker=0",
               "https://engine.hotellook.com/api/v2/cache.json?location=Berlin&currency=eur"
               "&checkIn=2026-09-15&checkOut=2026-09-18&limit=3&marker=0"),
              ("engine lookup.json",
               "https://engine.hotellook.com/api/v2/lookup.json?query=Berlin&lang=de&limit=3"),
              ("engine static hotels",
               "https://engine.hotellook.com/api/v2/static/hotels.json?locationId=2621"),
              ("hotellook.com api lookup",
               "https://hotellook.com/api/v2/lookup.json?query=Berlin&lang=de&limit=3"),
              ("yasen tp v1 hotels",
               "https://yasen.hotellook.com/tp/v1/hotels?locationId=2621&limit=3"),
              ("api.tp data hotels.json",
               "https://api.travelpayouts.com/data/hotels.json"),
              ("api.tp hotels lookup v2",
               "https://api.travelpayouts.com/hotels/v2/lookup?query=Berlin&lang=de&limit=3"),
              ("api.tp v2 hotel prices",
               "https://api.travelpayouts.com/v2/prices/hotels?location=Berlin"),
              ("api.tp root",
               "https://api.travelpayouts.com/"),
          ]
          for name, url in candidates:
              call(name, url, headers={"X-Access-Token": TOKEN})

          print("\n=== Zusatz: Token als Query-Parameter statt Header ===")
          if TOKEN:
              call("engine cache.json ?token=",
                   "https://engine.hotellook.com/api/v2/cache.json?"
                   + urllib.parse.urlencode({"location": "Berlin", "currency": "eur",
                                              "checkIn": "2026-09-15",
                                              "checkOut": "2026-09-18",
                                              "limit": 3, "token": TOKEN}))
          PY
