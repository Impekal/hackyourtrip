name: "Probe round 13 - db-vendo-client dbweb-Profil im Quelltext lesen"

# Runde 12 hat gezeigt: app.vendo.noncd.db.de existiert nicht im
# oeffentlichen DNS (beide Adressfamilien NXDOMAIN, waehrend die Kontrolle
# www.bahn.de beide liefert). Das `dbnav`-Profil ist fuer uns also nicht
# erreichbar.
#
# ABER: db-vendo-client hat ein zweites Profil, `dbweb`, und das spricht
# genau den Host an, den wir schon erreichen - www.bahn.de/web/api. Dort
# antwortet unsere Ortssuche mit 200 und die Preissuche mit 403. Der
# Unterschied liegt also in der Anfrageform, und dieser Client kennt sie.
#
# Statt weiter Header zu raten: den Quelltext lesen. Er liegt oeffentlich
# auf GitHub, und der Runner hat Internet - der Sandkasten nicht.
#
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen und die relevanten Stellen zeigen
        run: |
          set +e
          REPO=public-transport/db-vendo-client
          echo "=== Dateiliste des Repos ==="
          curl -sS "https://api.github.com/repos/$REPO/git/trees/HEAD?recursive=1" \
            | python3 -c "
          import json, sys
          try:
              tree = json.load(sys.stdin).get('tree', [])
          except Exception as e:
              print('Repo-Baum nicht lesbar:', e); raise SystemExit(0)
          paths = [t['path'] for t in tree if t['type'] == 'blob']
          print(f'{len(paths)} Dateien')
          for p in paths:
              if any(k in p.lower() for k in ('profile', 'dbweb', 'dbnav', 'endpoint', 'format')):
                  print('  ', p)
          "

          echo ""
          echo "=== Die Profil-Dateien im Volltext-Ausschnitt ==="
          for f in \
            p/dbweb/index.js \
            p/dbnav/index.js \
            p/db/index.js \
            p/dbweb/base.json \
            lib/request.js \
            index.js
          do
            echo ""
            echo "--------- $f"
            curl -sS -f "https://raw.githubusercontent.com/$REPO/HEAD/$f" -o /tmp/f.txt
            if [ $? -ne 0 ]; then echo "   (nicht vorhanden)"; continue; fi
            wc -l /tmp/f.txt
            # Nur die Zeilen, die fuer uns zaehlen: Endpunkte, Header, Auth.
            grep -nEi 'endpoint|https?://|headers?|user-agent|x-correlation|accept|content-type|referer|origin|cookie|token|auth' /tmp/f.txt | head -40
          done

          echo ""
          echo "=== README: was steht zu Blocking und Profilen? ==="
          curl -sS "https://raw.githubusercontent.com/$REPO/HEAD/readme.md" -o /tmp/r.md \
            || curl -sS "https://raw.githubusercontent.com/$REPO/HEAD/README.md" -o /tmp/r.md
          grep -nEi 'block|rate|limit|profile|dbweb|dbnav|api-key|apikey|bestprice|ticket' /tmp/r.md | head -40
