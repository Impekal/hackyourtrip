# Temporary: in which currency does Skiplagged quote? Deleted after use.
name: probe-resellers

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Currency evidence
        run: |
          cat > probe.py <<'PY'
          import json, re, urllib.parse, urllib.request

          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "de-DE,de;q=0.9"}

          def raw(url, headers=None):
              h = dict(H); h.update(headers or {})
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=40) as r:
                  return r.read().decode("utf-8", "replace")

          # 1. What does their own page say next to a price?
          html = raw("https://skiplagged.com/flights/HAM/LYS/2026-09-15")
          for pattern in (r'currency["\s:=]{1,4}"?([A-Z]{3})', r'"currencyCode"\s*:\s*"([A-Z]{3})"',
                          r'(\$|€)\s?\d{2,4}', r'data-currency="([^"]+)"'):
              hits = re.findall(pattern, html)[:6]
              print(f"  {pattern!r}: {hits}")

          # 2. Same flight in a source whose currency is certain (Travelpayouts
          #    is queried in EUR): compare the number for a busy route.
          sk = json.loads(raw("https://skiplagged.com/api/search.php?" + urllib.parse.urlencode({
              "from": "BER", "to": "BCN", "depart": "2026-09-25", "return": "",
              "poll": "true", "sort": "cost"})))
          cheapest = min((d[0][0] for d in (sk.get("depart") or []) if d and d[0]), default=None)
          print("\nSkiplagged BER->BCN 25.09. billigster Wert:", cheapest)
          print("Ryanair meldete fuer dieselbe Strecke/Datum: 5336 (= 53.36 EUR)")
          PY
          python3 probe.py
