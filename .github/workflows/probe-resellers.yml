# Temporary: which currency does Skiplagged answer in? Deleted after use.
name: probe-resellers

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Currency check
        run: |
          cat > probe.py <<'PY'
          import json, urllib.parse, urllib.request

          def get(url, lang="de-DE,de;q=0.9"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                 "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
                  "Accept": "application/json", "Accept-Language": lang})
              with urllib.request.urlopen(req, timeout=40) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          base = {"from": "HAM", "to": "LYS", "depart": "2026-09-15",
                  "return": "", "poll": "true", "sort": "cost"}

          for label, extra, lang in [
              ("default (de)", {}, "de-DE,de;q=0.9"),
              ("currency=EUR", {"currency": "EUR"}, "de-DE,de;q=0.9"),
              ("currency=USD", {"currency": "USD"}, "en-US,en;q=0.9"),
              ("en-US ohne currency", {}, "en-US,en;q=0.9"),
          ]:
              try:
                  data = get("https://skiplagged.com/api/search.php?" +
                             urllib.parse.urlencode({**base, **extra}), lang)
              except Exception as exc:
                  print(f"{label}: FAIL {exc}"); continue
              info = data.get("info")
              depart = data.get("depart") or []
              cheapest = min((d[0][0] for d in depart if d and d[0]), default=None)
              print(f"{label}: info={json.dumps(info, ensure_ascii=False)[:300]}")
              print(f"    billigster Eintrag (Cent?): {cheapest}   Eintraege: {len(depart)}")
              if depart:
                  print(f"    erster depart-Eintrag komplett: {json.dumps(depart[0], ensure_ascii=False)[:180]}")
              print()
          PY
          python3 probe.py
