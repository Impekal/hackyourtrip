# Temporary: is the live GitHub-Pages site actually serving the current
# app.js, and does the HAM->LYS round trip return real fares? Deleted after use.
name: probe-pages

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site + route
        run: |
          cat > probe.py <<'PY'
          import json, urllib.parse, urllib.request

          UA = {"User-Agent": "HackYourTrip-Probe/1.0"}

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace"), dict(resp.headers)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace"), dict(exc.headers)
              except Exception as exc:
                  return None, f"{type(exc).__name__}: {exc}", {}

          for base in ("https://kalivolut.github.io/hackyourtrip",
                       "https://mysportpilot.github.io/hackyourtrip"):
              print(f"##### {base}")
              status, body, headers = fetch(f"{base}/")
              print("  index.html:", status, "len", len(body))
              if status == 200:
                  print("   enthält ?v= :", "app.js?v=" in body)
                  print("   enthält buildStamp:", 'id="buildStamp"' in body)
                  print("   age/last-modified:", headers.get("age"), "|", headers.get("last-modified"))
              status, body, _ = fetch(f"{base}/app.js")
              print("  app.js:", status, "len", len(body))
              if status == 200:
                  for marker in ("BUILD_STAMP", "mockModeLabels", "resolveAirportCode",
                                 "lastProxyError", "fetchRealTransitOffers"):
                      print(f"   {marker}: {marker in body}")
              print()

          # The exact search from the report: HAM -> LYS, 14.08. -> 16.08., round trip.
          W = "https://hackyourtrip-proxy.iamanamelessman.workers.dev"
          def worker(params):
              url = f"{W}/cheap?{urllib.parse.urlencode(params)}"
              status, body, _ = fetch(url)
              try:
                  data = json.loads(body)
              except Exception:
                  return status, body[:200]
              rows = data.get("data") or []
              return status, f"{len(rows)} Angebote" + (f", erstes: {rows[0].get('departure_at')} {rows[0].get('price')}" if rows else "")

          print("##### HAM -> LYS")
          print(" Hin+zurück (return_at als Monat):", worker(
              {"origin": "HAM", "destination": "LYS", "currency": "eur", "limit": 1000,
               "sorting": "price", "departure_at": "2026-08", "return_at": "2026-08", "one_way": "false"}))
          print(" nur hin:", worker(
              {"origin": "HAM", "destination": "LYS", "currency": "eur", "limit": 1000,
               "sorting": "price", "departure_at": "2026-08", "one_way": "true"}))
          print(" Gegenprobe BER->BCN nur hin:", worker(
              {"origin": "BER", "destination": "BCN", "currency": "eur", "limit": 1000,
               "sorting": "price", "departure_at": "2026-09", "one_way": "true"}))
          print(" Gegenprobe BER->BCN hin+zurück:", worker(
              {"origin": "BER", "destination": "BCN", "currency": "eur", "limit": 1000,
               "sorting": "price", "departure_at": "2026-09", "return_at": "2026-09", "one_way": "false"}))
          PY
          python3 probe.py
