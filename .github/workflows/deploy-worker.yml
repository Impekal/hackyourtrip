name: Deploy proxy worker

# Deploys worker/ to Cloudflare - no local CLI needed. Requires two repo
# secrets from the Cloudflare dashboard (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Reuses the
# existing TRAVELPAYOUTS_TOKEN secret (already set up for check-deals.yml) to
# configure the Worker's own copy of the token - nothing to duplicate.
# See README "Live-Suche mit echten Preisen" for the full walkthrough.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker and set its TRAVELPAYOUTS_TOKEN secret
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Each AI key is listed only when that repo secret actually exists:
          # wrangler-action fails the whole deploy for any secret it is told
          # to upload but can't find, and the AI recommendation is meant to
          # be optional. Blank lines are dropped by getMultilineInput.
          secrets: |
            TRAVELPAYOUTS_TOKEN
            ${{ secrets.GEMINI_API_KEY != '' && 'GEMINI_API_KEY' || '' }}
            ${{ secrets.GROQ_API_KEY != '' && 'GROQ_API_KEY' || '' }}
            ${{ secrets.MISTRAL_API_KEY != '' && 'MISTRAL_API_KEY' || '' }}
            ${{ vars.AI_MODEL != '' && 'AI_MODEL' || '' }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # All optional: set exactly one of these for the "KI-Empfehlung"
          # button. Without any, the /ai endpoint reports itself unconfigured
          # and the UI says so. Priority if several are set: Gemini, Groq,
          # Mistral.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Optional override if a provider retires the default model name.
          AI_MODEL: ${{ vars.AI_MODEL }}

      # Sanity check the live endpoint right after deploy - this repo's own
      # sandbox dev environment can't reach the public internet to verify
      # this itself, so it's worth having a real check run somewhere that can.
      - name: Smoke test the deployed worker
        run: |
          BASE="https://hackyourtrip-proxy.iamanamelessman.workers.dev"
          MONTH="$(date -d '+30 days' +%Y-%m)"

          echo "=== /cheap (prices_for_dates, whole month) ==="
          curl -sS "$BASE/cheap?origin=BER&destination=BCN&departure_at=$MONTH&currency=eur&limit=1000&sorting=price&one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('offers:', len(d.get('data',[])))"

          echo "=== /latest (second index) ==="
          curl -sS "$BASE/latest?origin=BER&destination=BCN&currency=eur&limit=1000&period_type=month&beginning_of_period=$MONTH-01&one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('offers:', len(d.get('data',[])))"

          # Print the body, not just the status: 501 means "no AI key set"
          # (fine, the feature is optional) but 502 carries the provider's
          # actual reason - which is the only thing that makes it fixable.
          echo "=== /ai (501 = no key configured, 200 = working) ==="
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"prompt":"Antworte nur mit: ok"}' "$BASE/ai"
