name: Deploy proxy worker

# Deploys worker/ to Cloudflare - no local CLI needed. Requires two repo
# secrets from the Cloudflare dashboard (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Reuses the
# existing TRAVELPAYOUTS_TOKEN secret (already set up for check-deals.yml) to
# configure the Worker's own copy of the token - nothing to duplicate.
# See README "Live-Suche mit echten Preisen" for the full walkthrough.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker and set its TRAVELPAYOUTS_TOKEN secret
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Each AI key is listed only when that repo secret actually exists:
          # wrangler-action fails the whole deploy for any secret it is told
          # to upload but can't find, and the AI recommendation is meant to
          # be optional. Blank lines are dropped by getMultilineInput.
          secrets: |
            TRAVELPAYOUTS_TOKEN
            ${{ secrets.GEMINI_API_KEY != '' && 'GEMINI_API_KEY' || '' }}
            ${{ secrets.GROQ_API_KEY != '' && 'GROQ_API_KEY' || '' }}
            ${{ secrets.MISTRAL_API_KEY != '' && 'MISTRAL_API_KEY' || '' }}
            ${{ secrets.LITEAPI_KEY != '' && 'LITEAPI_KEY' || '' }}
            ${{ vars.AI_MODEL != '' && 'AI_MODEL' || '' }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # All optional: set exactly one of these for the "KI-Empfehlung"
          # button. Without any, the /ai endpoint reports itself unconfigured
          # and the UI says so. Priority if several are set: Gemini, Groq,
          # Mistral.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Hotelpreise (LiteAPI). Ohne diesen Schluessel bleibt der
          # Hotel-Modus wie bisher bei Anbieterlinks - es gibt sonst keine
          # freie Quelle fuer Hotelpreise.
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
          # Optional override if a provider retires the default model name.
          AI_MODEL: ${{ vars.AI_MODEL }}

      # Sanity check the live endpoint right after deploy - this repo's own
      # sandbox dev environment can't reach the public internet to verify
      # this itself, so it's worth having a real check run somewhere that can.
      - name: Smoke test the deployed worker
        run: |
          BASE="https://hackyourtrip-proxy.iamanamelessman.workers.dev"
          MONTH="$(date -d '+30 days' +%Y-%m)"

          echo "=== /cheap (prices_for_dates, whole month) ==="
          curl -sS "$BASE/cheap?origin=BER&destination=BCN&departure_at=$MONTH&currency=eur&limit=1000&sorting=price&one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('offers:', len(d.get('data',[])))"

          echo "=== /latest (second index) ==="
          curl -sS "$BASE/latest?origin=BER&destination=BCN&currency=eur&limit=1000&period_type=month&beginning_of_period=$MONTH-01&one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('offers:', len(d.get('data',[])))"

          # Transitous: real train connections, no key needed. Checked end to
          # end (geocode -> plan) because this is the only place with
          # internet access - and because a passthrough that silently returns
          # nothing would drop the whole Bahn/Bus mode back to example data
          # without anyone noticing.
          echo "=== /transit/geocode + /transit/plan ==="
          python3 - "$BASE" <<'PY'
          import json, sys, urllib.parse, urllib.request

          base = sys.argv[1]

          def get(path, **params):
              url = f"{base}{path}?{urllib.parse.urlencode(params)}"
              # Without an explicit User-Agent this never even reaches the
              # Worker: Cloudflare answers urllib's default UA with 403
              # "error code: 1010" (banned browser signature). The other
              # checks in this step use curl and don't hit that.
              req = urllib.request.Request(url, headers={"User-Agent": "HackYourTrip-SmokeTest/1.0"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return json.load(resp)

          def stop(text):
              hits = get("/transit/geocode", text=text, language="de")
              stops = [h for h in hits if h.get("type") == "STOP" and h.get("id")]
              print(f"geocode {text!r}: {len(hits)} Treffer, davon {len(stops)} Haltestellen")
              assert stops, f"keine Haltestelle für {text!r}"
              return stops[0]

          origin, destination = stop("Berlin Hauptbahnhof"), stop("München Hbf")
          plan = get("/transit/plan", fromPlace=origin["id"], toPlace=destination["id"],
                     time="2026-09-15T04:00:00Z", numItineraries=5,
                     transitModes="HIGHSPEED_RAIL,LONG_DISTANCE,REGIONAL_RAIL,WALK")
          itineraries = plan.get("itineraries", [])
          print("Verbindungen:", len(itineraries))
          assert itineraries, "plan lieferte keine Verbindung"
          first = itineraries[0]
          lines = [leg.get("displayName") or leg.get("mode") for leg in first["legs"]]
          print("erste Verbindung:", first["startTime"], "->", first["endTime"], "|", " -> ".join(lines))
          PY

          # Ryanair: real bookable fares, no key. Same reason as the transit
          # check - this is the only place with internet access, and a broken
          # passthrough would silently cost the one source that returns live
          # airline prices.
          echo "=== /ryanair/oneWayFares ==="
          python3 - "$BASE" <<'PY'
          import json, sys, urllib.parse, urllib.request

          base = sys.argv[1]
          q = urllib.parse.urlencode({
              "departureAirportIataCode": "BER", "arrivalAirportIataCode": "BCN",
              "outboundDepartureDateFrom": "2026-09-01",
              "outboundDepartureDateTo": "2026-09-30",
              "currency": "EUR", "language": "de", "market": "de-de", "limit": 50,
          })
          req = urllib.request.Request(f"{base}/ryanair/oneWayFares?{q}",
                                       headers={"User-Agent": "HackYourTrip-SmokeTest/1.0"})
          with urllib.request.urlopen(req, timeout=45) as resp:
              fares = json.load(resp).get("fares") or []
          print("Fares:", len(fares))
          assert fares, "Ryanair lieferte keine Preise für BER->BCN"
          first = fares[0]["outbound"]
          print("billigster:", first["flightNumber"], first["departureDate"],
                first["price"]["value"], first["price"]["currencyCode"])
          PY

          echo "=== /skiplagged + /deals ==="
          python3 - "$BASE" <<'PY'
          import json, sys, urllib.parse, urllib.request

          base = sys.argv[1]

          def get(path):
              req = urllib.request.Request(f"{base}{path}",
                                           headers={"User-Agent": "HackYourTrip-SmokeTest/1.0"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return json.load(resp)

          q = urllib.parse.urlencode({"from": "HAM", "to": "LYS", "depart": "2026-09-15"})
          data = get(f"/skiplagged?{q}")
          print("Skiplagged Verbindungen:", len(data.get("depart") or []))
          assert data.get("depart"), "Skiplagged lieferte keine Verbindungen"

          posts = get("/deals").get("posts") or []
          print("Deal-Beitraege:", len(posts))
          assert posts, "keine Deal-Beitraege"
          print("erster:", posts[0]["title"][:90])
          # The feeds double-escape their HTML; unescaped entities reaching the
          # page would be visible gibberish.
          assert "&lt;" not in posts[0]["title"] and "&amp;" not in posts[0]["title"]
          PY

          # /bahn is the one source that quotes real DB fares. From a GitHub
          # runner it answers 403 OPS_BLOCKED (bot wall). This step asks the
          # only open question: does Cloudflare's egress get through?
          # Deliberately not asserted - a block is a measurement, not a
          # broken deployment, so it must not fail the deploy.
          echo "=== /bahn/orte + /bahn/fahrplan (403 = DB blocks us, 200 = live fares) ==="
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            "$BASE/bahn/orte?q=Berlin%20Hbf" | head -c 600; echo
          python3 - "$BASE" <<'PY' || echo "Bahn-Test beendet (siehe Status oben)"
          import json, sys, urllib.error, urllib.parse, urllib.request

          base = sys.argv[1]

          def get(path):
              req = urllib.request.Request(f"{base}{path}",
                                           headers={"User-Agent": "HackYourTrip-SmokeTest/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode("utf-8", "replace") or "{}")

          status, places = get("/bahn/orte?" + urllib.parse.urlencode({"q": "Berlin Hbf"}))
          print("Ortssuche:", status)
          if status != 200 or not isinstance(places, list) or not places:
              print("  -> keine Orte, Preisabfrage entfaellt:", str(places)[:200])
              raise SystemExit(0)
          start = places[0]["id"]
          _, ziele = get("/bahn/orte?" + urllib.parse.urlencode({"q": "München Hbf"}))
          ziel = ziele[0]["id"]

          status, data = get("/bahn/fahrplan?" + urllib.parse.urlencode(
              {"from": start, "to": ziel, "date": "2026-09-15T08:00:00"}))
          print("Verbindungssuche:", status)
          conns = (data or {}).get("verbindungen") or []
          print("  Verbindungen:", len(conns))
          for c in conns[:3]:
              preis = (c.get("angebotsPreis") or {})
              print("   ", c.get("verbindungsAbschnitte", [{}])[0].get("abfahrtsZeitpunkt"),
                    preis.get("betrag"), preis.get("waehrung"))
          PY

          # Print the body, not just the status: 501 means "no AI key set"
          # (fine, the feature is optional) but 502 carries the provider's
          # actual reason - which is the only thing that makes it fixable.
          echo "=== /ai (501 = no key configured, 200 = working) ==="
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"prompt":"Antworte nur mit: ok"}' "$BASE/ai"
