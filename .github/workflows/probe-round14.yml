name: "Probe round 14 - db-vendo-client Setup und Antwortformat lesen"

# Der Nutzer geht den Heim-Weg: db-vendo-client auf dem eigenen Rechner,
# die App holt die Bahnpreise von dort. Bevor eine Anleitung geschrieben
# wird, die geraten ist: die tatsaechliche Run-Anweisung und das
# Antwortformat aus dem Quelltext lesen. Der Runner hat Internet (er kommt
# nur nicht an die DB-Preise - das ist hier egal, wir lesen nur Code/Docs).
#
# Gesucht:
#   - Docker-Image / Port / Profil-Variable (Setup fuer den Nutzer)
#   - die REST-Route fuer Verbindungen MIT Preis und ihre Parameter
#   - das JSON-Feld, in dem der Preis steht (fuer den Parser in app.js)
#
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: README, Dockerfile, api.js, package.json lesen
        run: |
          set +e
          REPO=public-transport/db-vendo-client
          raw() { curl -sS -f "https://raw.githubusercontent.com/$REPO/HEAD/$1"; }

          echo "############ package.json (Name, Version, bin, scripts) ############"
          raw package.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for k in ('name','version','description','main','type'):
              print(k,'=',d.get(k))
          print('bin =', d.get('bin'))
          print('scripts =', json.dumps(d.get('scripts',{}), indent=2))
          print('dependencies =', list((d.get('dependencies') or {}).keys()))
          "

          echo ""
          echo "############ Dockerfile ############"
          raw Dockerfile || echo "(kein Dockerfile)"

          echo ""
          echo "############ api.js (der REST-Server) ############"
          raw api.js || echo "(kein api.js)"

          echo ""
          echo "############ README: Abschnitte zu Docker/Run/Port/Profil ############"
          raw readme.md > /tmp/readme.md 2>/dev/null || raw README.md > /tmp/readme.md
          grep -nEi 'docker|ghcr|podman|npm (start|run)|node api|PORT|3000|DB_PROFILE|profile|localhost|127.0.0.1|bestprice|tickets' /tmp/readme.md | head -60

          echo ""
          echo "############ docs-Verzeichnis auflisten ############"
          curl -sS "https://api.github.com/repos/$REPO/git/trees/HEAD?recursive=1" \
            | python3 -c "
          import json,sys
          for t in json.load(sys.stdin).get('tree',[]):
              p=t['path']
              if p.startswith('docs/') or 'example' in p.lower() or 'fixture' in p.lower() or p.endswith('.md'):
                  print(p)
          " | head -40

          echo ""
          echo "############ hafas-rest-api: welche Routen + CORS? ############"
          # db-vendo-client serviert ueber hafas-rest-api. Dessen Routen und
          # ob CORS anschaltbar ist, entscheidet, ob der Browser direkt
          # http://127.0.0.1:3000 rufen darf.
          curl -sS "https://raw.githubusercontent.com/public-transport/hafas-rest-api/HEAD/readme.md" \
            2>/dev/null | grep -nEi 'cors|/journeys|/locations|Access-Control|origin|port' | head -30

          echo ""
          echo "############ Beispiel-Antwort einer Journey MIT Preis suchen ############"
          # Test-Fixtures oder Doku, die das price-Feld zeigen.
          for f in \
            docs/journeys.md \
            docs/index.md \
            test/index.js \
            test/fixtures/journeys.json
          do
            echo "--- $f"
            raw "$f" 2>/dev/null | grep -nEi 'price|amount|currency|"total"|bestprice|loadFactor' | head -15
          done
