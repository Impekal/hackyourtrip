name: Explore Travelpayouts prices endpoints for more results (temporary)

# Final check: aviasales/v3/prices_for_dates is the clear winner (27 offers
# per month-call incl. real per-itinerary links + gate names, vs 1 offer per
# call from v1/prices/cheap). This run confirms how it behaves for a single
# specific date, which is what the provider will actually request.
# Delete once confirmed.

on:
  workflow_dispatch: {}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: prices_for_dates, ONE specific date, one_way
        continue-on-error: true
        run: |
          curl -sS \
            -H "X-Access-Token: ${{ secrets.TRAVELPAYOUTS_TOKEN }}" \
            --get "https://api.travelpayouts.com/aviasales/v3/prices_for_dates" \
            --data-urlencode "origin=BER" --data-urlencode "destination=BCN" \
            --data-urlencode "departure_at=2026-09-18" --data-urlencode "currency=eur" \
            --data-urlencode "limit=1000" --data-urlencode "sorting=price" \
            --data-urlencode "one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('data',[]); print('COUNT:', len(r)); print('GATES:', sorted({x.get('gate') for x in r})); print('AIRLINES:', sorted({x.get('airline') for x in r})); print('TRANSFERS:', sorted({x.get('transfers') for x in r})); print('DATES:', sorted({x['departure_at'][:10] for x in r}))"
          echo

      - name: prices_for_dates, ONE specific date, round trip with return_at
        continue-on-error: true
        run: |
          curl -sS \
            -H "X-Access-Token: ${{ secrets.TRAVELPAYOUTS_TOKEN }}" \
            --get "https://api.travelpayouts.com/aviasales/v3/prices_for_dates" \
            --data-urlencode "origin=BER" --data-urlencode "destination=BCN" \
            --data-urlencode "departure_at=2026-09-18" \
            --data-urlencode "return_at=2026-09-25" \
            --data-urlencode "currency=eur" --data-urlencode "limit=1000" \
            --data-urlencode "sorting=price" --data-urlencode "one_way=false" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('data',[]); print('COUNT:', len(r)); print('SAMPLE:', json.dumps(r[:1], indent=1))"
          echo

      - name: prices_for_dates, whole month, round trip
        continue-on-error: true
        run: |
          curl -sS \
            -H "X-Access-Token: ${{ secrets.TRAVELPAYOUTS_TOKEN }}" \
            --get "https://api.travelpayouts.com/aviasales/v3/prices_for_dates" \
            --data-urlencode "origin=BER" --data-urlencode "destination=BCN" \
            --data-urlencode "departure_at=2026-09" \
            --data-urlencode "return_at=2026-09" \
            --data-urlencode "currency=eur" --data-urlencode "limit=1000" \
            --data-urlencode "sorting=price" --data-urlencode "one_way=false" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('data',[]); print('COUNT:', len(r)); print('KEYS:', sorted(r[0].keys()) if r else None)"
          echo

      - name: prices_for_dates, city code destination (LON = all London airports)
        continue-on-error: true
        run: |
          curl -sS \
            -H "X-Access-Token: ${{ secrets.TRAVELPAYOUTS_TOKEN }}" \
            --get "https://api.travelpayouts.com/aviasales/v3/prices_for_dates" \
            --data-urlencode "origin=BER" --data-urlencode "destination=LON" \
            --data-urlencode "departure_at=2026-09" --data-urlencode "currency=eur" \
            --data-urlencode "limit=1000" --data-urlencode "sorting=price" \
            --data-urlencode "one_way=true" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('data',[]); print('COUNT:', len(r)); print('DEST AIRPORTS:', sorted({x.get('destination_airport') for x in r}))"
          echo
