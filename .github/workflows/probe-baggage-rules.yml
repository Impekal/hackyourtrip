name: Probe published baggage rules

# Wegwerf-Workflow: holt die *veroeffentlichten* Gepaeckbestimmungen der
# Anbieter und zeigt die gefundenen Zahlen mit Umfeld. Die APIs nennen kein
# Gepaeck (siehe probe-baggage.yml), also ist das die einzige belegbare
# Quelle - und sie muss von der Anbieterseite kommen, nicht aus dem
# Gedaechtnis. Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Gepaeckseiten abrufen und Zahlen herausziehen
        run: |
          python3 - <<'PY'
          import gzip, io, re, urllib.error, urllib.request

          URLS = [
              ("FlixBus DE Gepaeck", "https://www.flixbus.de/service/gepaeck"),
              ("FlixBus DE Beförderungsbed.", "https://www.flixbus.de/unternehmen/agb"),
              ("FlixBus global luggage", "https://www.flixbus.com/service/luggage"),
              ("FlixBus Help luggage", "https://help.flixbus.com/s/article/what-luggage-can-i-take?language=en_US"),
              ("Ryanair Gepaeck DE", "https://www.ryanair.com/de/de/nuetzliche-infos/hilfe-center/faq-uebersicht/Gepack"),
              ("Ryanair bags EN", "https://www.ryanair.com/gb/en/useful-info/help-centre/faq-overview/Baggage"),
              ("Ryanair fees", "https://www.ryanair.com/gb/en/useful-info/help-centre/fees"),
          ]

          HEADERS = {
              "User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "de-DE,de;q=0.9,en;q=0.8",
              "Accept-Encoding": "gzip",
          }

          # "7 kg", "20 kg", "42 x 30 x 18 cm", "40x20x25cm"
          NUM = re.compile(r"(\d{1,3}(?:[.,]\d)?\s*kg|\d{2,3}\s*[x×]\s*\d{2,3}\s*[x×]\s*\d{2,3}\s*cm)", re.I)

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=45) as resp:
                  raw = resp.read()
                  if resp.headers.get("Content-Encoding") == "gzip":
                      raw = gzip.decompress(raw)
                  return resp.status, raw.decode("utf-8", "replace")

          def text_of(html):
              html = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\1>", " ", html)
              html = re.sub(r"(?s)<[^>]+>", " ", html)
              html = (html.replace("&nbsp;", " ").replace("&amp;", "&")
                          .replace("&quot;", '"').replace("&#39;", "'")
                          .replace("&auml;", "ä").replace("&ouml;", "ö")
                          .replace("&uuml;", "ü").replace("&szlig;", "ß")
                          .replace("&times;", "x"))
              return re.sub(r"\s+", " ", html).strip()

          for name, url in URLS:
              print(f"\n===== {name} =====\n{url}")
              try:
                  status, html = fetch(url)
              except urllib.error.HTTPError as exc:
                  print(f"  HTTP {exc.code} - nicht abrufbar")
                  continue
              except Exception as exc:
                  print(f"  FEHLER: {exc}")
                  continue
              text = text_of(html)
              print(f"  HTTP {status}, {len(text)} Zeichen Text")
              if len(text) < 400:
                  print("  (kaum Text - vermutlich JS-gerendert oder Bot-Wall)")
              seen = set()
              hits = 0
              for m in NUM.finditer(text):
                  around = text[max(0, m.start() - 130):m.end() + 130]
                  key = re.sub(r"\s+", "", around)[:60]
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f"    …{around}…")
                  hits += 1
                  if hits >= 12:
                      break
              if not hits:
                  print("    keine kg-/cm-Angabe im Text gefunden")
          PY
