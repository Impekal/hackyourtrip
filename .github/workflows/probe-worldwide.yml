# Temporary: round 2 - chase the near-misses from the first sweep.
# FlixBus wants UUIDs, DB moved hosts, Hotellook may want the token.
name: probe-worldwide

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Chase near-misses
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          cat > probe.py <<'PY'
          import json, os, urllib.parse, urllib.request

          BROWSER = {
              "User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "de-DE,de;q=0.9,en;q=0.8",
          }
          FLIX = {"X-API-Authentication": "3vJKYJVSDF9ZLcTAKX4V"}

          def probe(label, url, headers=None, data=None, show=700):
              hdr = dict(BROWSER); hdr.update(headers or {})
              body = json.dumps(data).encode() if data is not None else None
              if body is not None:
                  hdr.setdefault("Content-Type", "application/json")
              req = urllib.request.Request(url, data=body, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      text = resp.read().decode("utf-8", "replace")
                      print(f"[OK  {resp.status}] {label}  ({len(text)} bytes)")
                      print("        ", text[:show].replace("\n", " "))
                      return text
              except urllib.error.HTTPError as exc:
                  print(f"[HTTP {exc.code}] {label}  {exc.read()[:250].decode('utf-8','replace')}")
              except Exception as exc:
                  print(f"[FAIL   ] {label}  {type(exc).__name__}: {exc}")
              return None

          print("########## FLIXBUS mit UUIDs ##########")
          def flix_city(name):
              raw = probe(f"autocomplete {name}",
                          "https://global.api.flixbus.com/search/autocomplete/cities?" +
                          urllib.parse.urlencode({"q": name, "lang": "de"}),
                          headers=FLIX, show=120)
              if not raw:
                  return None
              for hit in json.loads(raw):
                  if hit.get("id"):
                      print(f"         -> {hit['name']}: {hit['id']}")
                      return hit["id"]
              return None

          a, b = flix_city("Berlin"), flix_city("München")
          if a and b:
              probe("FlixBus Suche mit UUID (PREISE?)",
                    "https://global.api.flixbus.com/search/service/v4/search?" +
                    urllib.parse.urlencode({
                        "from_city_id": a, "to_city_id": b,
                        "departure_date": "15.09.2026", "products": '{"adult":1}',
                        "currency": "EUR", "locale": "de", "search_by": "cities",
                        "include_after_midnight_rides": 1}),
                    headers=FLIX, show=1400)

          print("\n########## DEUTSCHE BAHN, neue Hosts ##########")
          for host in ("https://int.bahn.de/web/api/angebote/fahrplan",
                       "https://www.bahn.de/web/api/angebote/fahrplan",
                       "https://int.bahn.de/web/api/angebote/tagesbestpreis"):
              probe(host, host,
                    data={"abfahrtsHalt": "A=1@O=Hamburg Hbf@X=10006909@Y=53552733@U=80@L=8002549@",
                          "anfrageZeitpunkt": "2026-09-15T08:00:00",
                          "ankunftsHalt": "A=1@O=München Hbf@X=11558339@Y=48140229@U=80@L=8000261@",
                          "ankunftSuche": "ABFAHRT", "klasse": "KLASSE_2",
                          "produktgattungen": ["ICE", "EC_IC", "IR", "REGIONAL", "SBAHN"],
                          "reisende": [{"typ": "ERWACHSENER", "ermaessigungen": [{"art": "KEINE_ERMAESSIGUNG", "klasse": "KLASSENLOS"}], "alter": [], "anzahl": 1}],
                          "schnelleVerbindungen": True, "sitzplatzOnly": False,
                          "bikeCarriage": False, "reservierungsKontingenteVorhanden": False},
                    show=500)
          probe("bahn.de Bahnhofssuche",
                "https://int.bahn.de/web/api/reiseloesung/orte?suchbegriff=Hamburg%20Hbf&typ=ALL&limit=3", show=400)

          print("\n########## HOTELS: Hotellook-Varianten ##########")
          token = os.environ.get("TRAVELPAYOUTS_TOKEN", "")
          for label, url in [
              ("lookup v2 (neu?)", "https://engine.hotellook.com/api/v2/lookup.json?query=Barcelona&lang=de&lookFor=both&limit=5"),
              ("cache v2", "https://engine.hotellook.com/api/v2/cache.json?location=Barcelona&currency=eur&checkIn=2026-09-15&checkOut=2026-09-18&limit=5"),
              ("yasen dump", "https://yasen.hotellook.com/tp/public/widget_location_dump.json?lang=de&flag=&limit=3&type=popularity"),
              ("hotellook static", "https://photo.hotellook.com/static/cities_pl.json"),
              ("tp hotel prices", f"https://api.travelpayouts.com/v1/hotels/prices?location=Barcelona&checkIn=2026-09-15&checkOut=2026-09-18&currency=eur&token={token}"),
              ("tp hotel lookup", f"https://api.travelpayouts.com/v1/hotels/lookup?query=Barcelona&lang=de&lookFor=city&limit=3&token={token}"),
          ]:
              probe(label, url, show=400)

          print("\n########## SONSTIGE ZWEITE CHANCE ##########")
          probe("Trenitalia (korrekter BFF)",
                "https://www.lefrecce.it/Channels.Website.BFF.WEB/website/locations/search?name=ROMA&limit=3",
                headers={"Accept-Encoding": "identity"}, show=300)
          probe("Ryanair Flughafenliste (für Umkreissuche)",
                "https://www.ryanair.com/api/views/locate/5/airports/de/active", show=200)
          PY
          python3 probe.py
