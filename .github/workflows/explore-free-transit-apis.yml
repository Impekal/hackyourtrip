name: Explore free transit APIs (temporary)

# Round 2. Round 1 said: transitous geocode works (no key), flixbus wrapper
# does not exist (NXDOMAIN), v5.db.transport.rest is 503, OpenTripMap needs
# a key. The DB journeys test failed on an empty response - could be the
# API or could be my script, so this round prints raw status + body instead
# of assuming. Delete once evaluated.

on:
  workflow_dispatch: {}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: "DB v6: is the service up at all?"
        continue-on-error: true
        run: |
          curl -sS --max-time 25 -o /dev/null -w 'root HTTP:%{http_code}\n' https://v6.db.transport.rest/ || true
          echo "--- locations ---"
          curl -sS --max-time 25 -w '\nHTTP:%{http_code}\n' \
            "https://v6.db.transport.rest/locations?query=Berlin%20Hbf&results=2" | head -c 800
          echo

      - name: "DB v6: journeys, raw output (no parsing assumptions)"
        continue-on-error: true
        run: |
          WHEN=$(date -u -d '+21 days' +%Y-%m-%d)T09:00:00+02:00
          echo "when=$WHEN"
          curl -sS --max-time 60 -w '\nHTTP:%{http_code}\n' --get \
            "https://v6.db.transport.rest/journeys" \
            --data-urlencode "from=8011160" --data-urlencode "to=8000261" \
            --data-urlencode "departure=$WHEN" --data-urlencode "results=4" \
            --data-urlencode "tickets=true" > out.txt 2>&1 || true
          echo "bytes: $(wc -c < out.txt)"
          head -c 1200 out.txt
          echo
          echo "--- price fields found ---"
          grep -o '"price":[^,}]*[,}]' out.txt | head -10 || echo "(keine)"
          grep -o '"amount":[0-9.]*' out.txt | head -10 || echo "(keine amount)"

      - name: "Transitous: kann es Verbindungen planen (nicht nur geocodieren)?"
        continue-on-error: true
        run: |
          FROM=$(curl -sS --max-time 25 "https://api.transitous.org/api/v1/geocode?text=Berlin%20Hbf" \
                 | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'])")
          TO=$(curl -sS --max-time 25 "https://api.transitous.org/api/v1/geocode?text=M%C3%BCnchen%20Hbf" \
               | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'])")
          WHEN=$(date -u -d '+21 days' +%Y-%m-%d)T07:00:00Z
          echo "from=$FROM"; echo "to=$TO"; echo "when=$WHEN"
          curl -sS --max-time 60 -w '\nHTTP:%{http_code}\n' --get \
            "https://api.transitous.org/api/v1/plan" \
            --data-urlencode "fromPlace=$FROM" --data-urlencode "toPlace=$TO" \
            --data-urlencode "time=$WHEN" --data-urlencode "numItineraries=3" > plan.txt 2>&1 || true
          echo "bytes: $(wc -c < plan.txt)"
          head -c 900 plan.txt
          echo
          echo "--- enthaelt es Preise/Fares? ---"
          grep -io 'fare\|price\|amount' plan.txt | sort | uniq -c | head || echo "(keine Preisfelder)"

      - name: "Weitere DB-Instanzen / Spiegel"
        continue-on-error: true
        run: |
          for h in "https://db.transport.rest/" \
                   "https://dbf.finalrewind.org/" \
                   "https://v6.vbb.transport.rest/" \
                   "https://v6.bvg.transport.rest/"; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$h" || echo 000)
            echo "$code  $h"
          done
