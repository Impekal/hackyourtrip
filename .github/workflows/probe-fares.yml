# Temporary: which of the candidate free, key-less fare sources actually
# answer, and with what shape? Deleted again after use.
name: probe-fares

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate sources
        run: |
          cat > probe.py <<'PY'
          import json, urllib.parse, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "application/json, text/plain, */*",
                "Accept-Language": "de-DE,de;q=0.9,en;q=0.8"}

          def get(label, url, headers=None):
              req = urllib.request.Request(url, headers=headers or UA)
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print(f"--- {label}: HTTP {resp.status}, {len(body)} bytes")
                      return body
              except urllib.error.HTTPError as exc:
                  print(f"--- {label}: HTTP {exc.code}  {exc.read()[:200]!r}")
              except Exception as exc:
                  print(f"--- {label}: {type(exc).__name__}: {exc}")
              return None

          def show(body, keys=3):
              if not body:
                  return
              try:
                  data = json.loads(body)
              except Exception:
                  print("    (kein JSON)", body[:200]); return
              print("    top-level:", list(data)[:10] if isinstance(data, dict) else f"list[{len(data)}]")
              print("    ", json.dumps(data, ensure_ascii=False)[:900])

          print("=========== RYANAIR ===========")
          for ver in ("v4", "3"):
              q = urllib.parse.urlencode({
                  "departureAirportIataCode": "BER", "arrivalAirportIataCode": "BCN",
                  "outboundDepartureDateFrom": "2026-09-01", "outboundDepartureDateTo": "2026-09-30",
                  "currency": "EUR", "language": "de", "limit": 20, "market": "de-de",
              })
              show(get(f"services-api farfnd/{ver}/oneWayFares",
                       f"https://services-api.ryanair.com/farfnd/{ver}/oneWayFares?{q}"))

          q = urllib.parse.urlencode({
              "outboundDepartureDateFrom": "2026-09-01", "outboundDepartureDateTo": "2026-09-30",
              "currency": "EUR", "market": "de-de", "language": "de",
          })
          show(get("cheapestPerDay BER->BCN",
                   f"https://services-api.ryanair.com/farfnd/v4/oneWayFares/BER/BCN/cheapestPerDay?{q}"))

          q = urllib.parse.urlencode({
              "departureAirportIataCode": "BER", "arrivalAirportIataCode": "BCN",
              "outboundDepartureDateFrom": "2026-09-01", "outboundDepartureDateTo": "2026-09-30",
              "inboundDepartureDateFrom": "2026-09-01", "inboundDepartureDateTo": "2026-09-30",
              "currency": "EUR", "market": "de-de", "language": "de", "limit": 20,
          })
          show(get("roundTripFares", f"https://services-api.ryanair.com/farfnd/v4/roundTripFares?{q}"))

          # Live availability (actual bookable seats + prices for one date)
          q = urllib.parse.urlencode({
              "ADT": 1, "CHD": 0, "INF": 0, "TEEN": 0, "DateOut": "2026-09-15",
              "Origin": "BER", "Destination": "BCN", "RoundTrip": "false",
              "FlexDaysBeforeOut": 3, "FlexDaysOut": 3, "ToUs": "AGREED",
          })
          show(get("availability BER->BCN 15.09.",
                   f"https://www.ryanair.com/api/booking/v4/de-de/availability?{q}"))

          # Which routes does Ryanair even serve from an airport?
          show(get("routes ab HAM",
                   "https://services-api.ryanair.com/locate/3/routes/HAM"))
          show(get("active airports",
                   "https://www.ryanair.com/api/views/locate/5/airports/de/active"))

          print("=========== DB SPARPREISE (inoffiziell) ===========")
          get("bahn.de bestprice", "https://www.bahn.de/web/api/angebote/tagesbestpreis")
          get("vendo fahrplan", "https://www.bahn.de/web/api/reiseloesung/fahrplan")

          print("=========== SONSTIGE ===========")
          get("Lufthansa open API", "https://api.lufthansa.com/v1/references/countries/DE")
          get("SNCF open data", "https://api.sncf.com/v1/coverage/sncf/")
          PY
          python3 probe.py
