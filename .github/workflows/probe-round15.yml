name: "Probe round 15 - LiteAPI Endpunkte kartieren"

# Runde 10 hat gezeigt: api.liteapi.travel antwortet 401 mit JSON, lebt also
# und vergibt Keys selbst. Bevor der Nutzer sich anmeldet und bevor Code
# entsteht, wird die Oberflaeche kartiert: welche Pfade gibt es ueberhaupt?
#
# Das Signal ist wie gehabt 401 (Pfad existiert, Schluessel fehlt) gegen 404
# (Pfad gibt es nicht). Mit einem Key im Secret werden zusaetzlich echte
# Antworten geholt - dann steht auch das Feldformat fest, statt geraten zu
# werden.
#
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiteAPI abklopfen
        env:
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          KEY = os.environ.get("LITEAPI_KEY", "")
          print("Key vorhanden:", bool(KEY))

          def call(name, url, method="GET", body=None, show=320):
              headers = {"Accept": "application/json",
                          "User-Agent": "HackYourTrip-Probe/1.0"}
              if KEY:
                  headers["X-API-Key"] = KEY
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode("utf-8", "replace")
                      print(f"  {r.status:>3}  {name}")
                      print(f"       {text[:show]}".replace("\n", " "))
              except urllib.error.HTTPError as e:
                  raw = e.read()[:show].decode("utf-8", "replace").replace("\n", " ")
                  kind = ("EXISTIERT, Schluessel fehlt/ungueltig"
                          if e.code in (401, 403) else
                          "Pfad unbekannt" if e.code == 404 else "andere Antwort")
                  print(f"  {e.code:>3}  {name}   [{kind}]")
                  print(f"       {raw}")
              except Exception as e:
                  print(f"  ---  {name}   {type(e).__name__}: {e}")

          BASE = "https://api.liteapi.travel/v3.0"
          print("=== Stammdaten ===")
          call("countries", f"{BASE}/data/countries")
          call("cities (DE)", f"{BASE}/data/cities?countryCode=DE")
          call("hotels (Berlin)", f"{BASE}/data/hotels?"
               + urllib.parse.urlencode({"countryCode": "DE", "cityName": "Berlin", "limit": 3}))
          call("hotel details", f"{BASE}/data/hotel?hotelId=lp1897")
          call("places (Autocomplete)", f"{BASE}/data/places?textQuery=Berlin")

          print("\n=== Preise / Verfuegbarkeit ===")
          rates_body = {
              "hotelIds": ["lp1897"],
              "occupancies": [{"adults": 2}],
              "currency": "EUR",
              "guestNationality": "DE",
              "checkin": "2026-09-15",
              "checkout": "2026-09-18",
          }
          call("hotels/rates (POST)", f"{BASE}/hotels/rates", "POST", rates_body, show=600)
          # Variante ohne hotelIds, dafuer mit Stadt - das waere fuer uns der
          # eigentliche Suchfall ("Hotels in Berlin vom .. bis ..").
          city_body = dict(rates_body)
          city_body.pop("hotelIds")
          city_body["cityName"] = "Berlin"
          city_body["countryCode"] = "DE"
          call("hotels/rates nach Stadt", f"{BASE}/hotels/rates", "POST", city_body, show=600)

          print("\n=== Gegenprobe: ein sicher falscher Pfad ===")
          call("gibtesnicht", f"{BASE}/data/gibtesnicht")
          PY
