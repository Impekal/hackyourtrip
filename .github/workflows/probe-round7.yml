name: Probe round 7 - Bahn, BlaBlaBus, Hotel

# Siebte Runde, gezielt auf die drei Luecken. Diesmal Ansaetze, die in den
# Runden 1-6 NICHT dran waren:
#   Bahn   - die Vendo-Mobil-API mit den exakten Headern der DB-App, die
#            Community-Frontends (bahn.expert), und db-rest nochmal (das
#            503 koennte ein Ausfall gewesen sein, kein Dauerzustand).
#   Bus    - BlaBlaCar Bus / frueher Ouibus (idbus).
#   Hotel  - Hotellook cache.json. Frueher wurden nur die
#            Travelpayouts-Hotel-Pfade probiert, nicht dieser Endpunkt.
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Endpunkte anfragen
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")

          def call(name, url, headers=None, data=None, method=None):
              hdrs = {"User-Agent": UA, "Accept": "application/json"}
              hdrs.update(headers or {})
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=hdrs, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      raw = r.read()
                      print(f"\n### {name}\n    {r.status} {url[:110]}")
                      text = raw.decode("utf-8", "replace")
                      # Preis-Stichworte suchen
                      low = text.lower()
                      marks = [w for w in ("preis", "price", "amount", "betrag",
                                            "fare", "angebot", "cent", "eur")
                               if w in low]
                      print(f"    {len(text)} Zeichen, Preis-Stichworte: {marks or 'keine'}")
                      print("    " + text[:700].replace("\n", " "))
                      return text
              except urllib.error.HTTPError as e:
                  detail = e.read()[:280].decode("utf-8", "replace").replace("\n", " ")
                  print(f"\n### {name}\n    HTTP {e.code} {url[:110]}\n    {detail}")
              except Exception as e:
                  print(f"\n### {name}\n    FEHLER {type(e).__name__}: {e}")
              return None

          print("=========== BAHN ===========")

          # 1. Vendo-Mobil-API - die API der DB-Navigator-App. Sie verlangt
          #    einen eigenen Accept-Typ; ohne den antwortet der Host anders.
          vendo_headers = {
              "Accept": "application/x.db.vendo.mob.verbindungssuche.v8+json",
              "Content-Type": "application/x.db.vendo.mob.verbindungssuche.v8+json",
              "X-Correlation-ID": "hackyourtrip-probe/1.0",
          }
          vendo_body = {
              "autonomeReservierung": False,
              "einstiegsTypList": ["STANDARD"],
              "klasse": "KLASSE_2",
              "reisende": [{"typ": "ERWACHSENER", "ermaessigungen": [
                  {"art": "KEINE_ERMAESSIGUNG", "klasse": "KLASSENLOS"}], "anzahl": 1}],
              "reiseHin": {"wunsch": {
                  "abgangsLocationId": "A=1@O=Berlin Hbf@X=13369549@Y=52525589@U=80@L=8011160@",
                  "zielLocationId": "A=1@O=München Hbf@X=11558339@Y=48140229@U=80@L=8000261@",
                  "zeitWunsch": {"reiseDatum": "2026-09-15T08:00:00",
                                  "zeitPunktArt": "ABFAHRT"},
                  "verkehrsmittel": ["ALLE"]}},
          }
          for host in ("https://app.vendo.noncd.db.de/mob/angebote/fahrplan",
                       "https://int.vendo.noncd.db.de/mob/angebote/fahrplan"):
              call(f"DB Vendo {host.split('//')[1][:22]}", host,
                   headers=vendo_headers, data=vendo_body, method="POST")

          # 2. bahn.expert - offenes Community-Frontend, proxyt Vendo/HAFAS.
          call("bahn.expert station search",
               "https://bahn.expert/api/stopPlace/v1/search/Berlin%20Hbf?max=3")
          call("bahn.expert journeys",
               "https://bahn.expert/api/journeys/v1/find?start=8011160&destination=8000261"
               "&time=2026-09-15T08:00:00.000Z")

          # 3. db-rest / hafas-Wrapper - beim letzten Mal 503. Ausfall oder Ende?
          for host in ("https://v6.db.transport.rest", "https://v5.db.transport.rest",
                       "https://db-rest.bendix.dev", "https://dbf.finalrewind.org"):
              call(f"db-rest {host.split('//')[1][:24]}",
                   f"{host}/journeys?from=8011160&to=8000261&departure=2026-09-15T08:00"
                   "&results=2&language=de")

          print("\n=========== BLABLACAR BUS ===========")
          for name, url in [
              ("BlaBlaCar Bus stops (idbus v2)", "https://api.idbus.com/v2/stops"),
              ("BlaBlaCar Bus stops (idbus v1)", "https://api.idbus.com/v1/stops"),
              ("BlaBlaCarBus meta", "https://api.blablacarbus.com/v2/stops"),
              ("BlaBlaCar booking search",
               "https://booking.blablacarbus.com/api/v1/search?origin_id=1&destination_id=2"
               "&date=2026-09-15&passengers=1"),
          ]:
              call(name, url)

          print("\n=========== HOTEL ===========")
          for name, url in [
              ("Hotellook cache.json",
               "https://engine.hotellook.com/api/v2/cache.json?"
               + urllib.parse.urlencode({"location": "Berlin", "currency": "eur",
                                          "checkIn": "2026-09-15", "checkOut": "2026-09-18",
                                          "limit": 5})),
              ("Hotellook lookup",
               "https://engine.hotellook.com/api/v2/lookup.json?"
               + urllib.parse.urlencode({"query": "Berlin", "lang": "de", "lookFor": "both",
                                          "limit": 5})),
              ("Hotellook static hotels",
               "https://yasen.hotellook.com/tp/v1/hotels?"
               + urllib.parse.urlencode({"locationId": 2621, "limit": 3})),
              ("Hotellook cheap prices",
               "https://engine.hotellook.com/api/v2/cache.json?"
               + urllib.parse.urlencode({"location": "Hamburg", "currency": "eur",
                                          "checkIn": "2026-10-01", "checkOut": "2026-10-03",
                                          "limit": 5})),
          ]:
              call(name, url)
          PY
