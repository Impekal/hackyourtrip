name: Probe round 8 - bahn.de Web-API, Hotel mit Token

# Runde 7 hat gezeigt: die Vendo-Hosts existieren nicht mehr (DNS weg),
# BlaBlaCar-Bus-APIs ebenfalls, Hotellook antwortet 404. Uebrig bleiben
# zwei Spuren, die noch nie dran waren:
#
#   1. `www.bahn.de/web/api/...` - der Endpunkt, den die heutige bahn.de
#      Website selbst benutzt. Frueher wurde nur int.bahn.de probiert.
#      Dort liegt auch die Bestpreissuche.
#   2. Travelpayouts-Hotels MIT dem vorhandenen Token - bisher wurden nur
#      die tokenlosen Hotellook-Pfade probiert.
#
# Wird nach der Auswertung geloescht.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Endpunkte anfragen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def call(name, url, headers=None, data=None, method=None, show=800):
              hdrs = {"User-Agent": UA, "Accept": "application/json",
                      "Accept-Language": "de-DE,de;q=0.9"}
              hdrs.update(headers or {})
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=hdrs, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      text = r.read().decode("utf-8", "replace")
                      low = text.lower()
                      marks = [w for w in ("preis", "price", "betrag", "amount",
                                            "angebot", "cent", "eur") if w in low]
                      print(f"\n### {name}\n    {r.status}  {len(text)} Zeichen"
                            f"  Preis-Stichworte: {marks or 'keine'}")
                      print("    " + text[:show].replace("\n", " "))
                      return text
              except urllib.error.HTTPError as e:
                  print(f"\n### {name}\n    HTTP {e.code}\n    "
                        + e.read()[:300].decode("utf-8", "replace").replace("\n", " "))
              except Exception as e:
                  print(f"\n### {name}\n    FEHLER {type(e).__name__}: {e}")
              return None

          print("=========== BAHN: www.bahn.de Web-API ===========")

          # Ortssuche - liefert die eindeutige Location-ID, die die
          # Verbindungssuche braucht.
          loc = call("bahn.de Ortssuche Berlin Hbf",
                     "https://www.bahn.de/web/api/reiseloesung/orte?suchbegriff="
                     + urllib.parse.quote("Berlin Hbf") + "&typ=ALL&limit=3")

          berlin_id = muenchen_id = None
          try:
              berlin_id = json.loads(loc)[0]["id"]
              m = call("bahn.de Ortssuche München Hbf",
                       "https://www.bahn.de/web/api/reiseloesung/orte?suchbegriff="
                       + urllib.parse.quote("München Hbf") + "&typ=ALL&limit=3")
              muenchen_id = json.loads(m)[0]["id"]
              print(f"\n    IDs: {berlin_id[:60]} / {muenchen_id[:60]}")
          except Exception as exc:
              print(f"\n    Ortssuche nicht auswertbar: {exc}")

          if berlin_id and muenchen_id:
              # Verbindungssuche MIT Preisen - das ist der Endpunkt, den die
              # Website beim Klick auf "Suchen" aufruft.
              body = {
                  "abfahrtsHalt": berlin_id,
                  "anfrageZeitpunkt": "2026-09-15T08:00:00",
                  "ankunftsHalt": muenchen_id,
                  "ankunftSuche": "ABFAHRT",
                  "klasse": "KLASSE_2",
                  "produktgattungen": ["ICE", "EC_IC", "IR", "REGIONAL", "SBAHN",
                                        "BUS", "SCHIFF", "UBAHN", "TRAM", "ANRUFPFLICHTIG"],
                  "reisende": [{"typ": "ERWACHSENER", "ermaessigungen": [
                      {"art": "KEINE_ERMAESSIGUNG", "klasse": "KLASSENLOS"}],
                      "alter": [], "anzahl": 1}],
                  "schnelleVerbindungen": True,
                  "sitzplatzOnly": False,
                  "bikeCarriage": False,
                  "reservierungsKontingenteVorhanden": False,
              }
              call("bahn.de Verbindungssuche (Preise!)",
                   "https://www.bahn.de/web/api/angebote/fahrplan",
                   headers={"Content-Type": "application/json"},
                   data=body, method="POST", show=1400)

              # Bestpreissuche - "der guenstigste Tag im Zeitraum".
              best = dict(body)
              best.pop("anfrageZeitpunkt", None)
              best["anfrageZeitpunkt"] = "2026-09-15T00:00:00"
              call("bahn.de Tagesbestpreis",
                   "https://www.bahn.de/web/api/angebote/tagesbestpreis",
                   headers={"Content-Type": "application/json"},
                   data=best, method="POST", show=1200)

          print("\n=========== HOTEL: Travelpayouts mit Token ===========")
          token = os.environ.get("TRAVELPAYOUTS_TOKEN", "")
          print("Token vorhanden:", bool(token))
          if token:
              for name, url in [
                  ("TP Hotels Suche (v2 cache)",
                   "https://engine.hotellook.com/api/v2/cache.json?"
                   + urllib.parse.urlencode({"location": "Berlin", "currency": "eur",
                                              "checkIn": "2026-09-15", "checkOut": "2026-09-18",
                                              "limit": 5, "token": token})),
                  ("TP Hotels data API",
                   "https://api.travelpayouts.com/data/de/hotels.json"),
                  ("TP Hotel prices v1",
                   "https://api.travelpayouts.com/v1/hotels/search?"
                   + urllib.parse.urlencode({"location": "Berlin",
                                              "checkIn": "2026-09-15",
                                              "checkOut": "2026-09-18",
                                              "token": token})),
                  ("TP affiliate hotel lookup",
                   "https://engine.hotellook.com/api/v2/lookup.json?"
                   + urllib.parse.urlencode({"query": "Berlin", "lang": "de",
                                              "lookFor": "both", "limit": 5,
                                              "token": token})),
              ]:
                  call(name, url, show=500)
          PY
