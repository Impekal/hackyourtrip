<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackYourTrip</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px; margin: 0 auto; padding: 1.5rem;
    background: #0d1117; color: #e6edf3;
  }
  h1 { font-size: 1.4rem; }
  .meta { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .route { border: 1px solid #30363d; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
  .route h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
  .route .notes { color: #8b949e; font-size: 0.85rem; margin-bottom: 0.75rem; }
  .option { border-top: 1px solid #21262d; padding: 0.6rem 0; }
  .option:first-child { border-top: none; }
  .price { font-weight: 600; font-size: 1.1rem; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; margin-left: 0.5rem; }
  .badge.error { background: #6e2020; color: #ffb3b3; }
  .badge.drop { background: #123a24; color: #7ee2a8; }
  .sites { color: #8b949e; font-size: 0.85rem; }
  .recs { margin: 0.4rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; color: #c9d1d9; }
  .empty { color: #8b949e; }
</style>
</head>
<body>
<h1>✈️ 🚆 🚌 🏨 HackYourTrip</h1>
<p class="meta" id="meta">lädt…</p>
<div id="routes"></div>

<script>
async function load() {
  const metaEl = document.getElementById('meta');
  const routesEl = document.getElementById('routes');
  let data;
  try {
    const resp = await fetch('./data/deals.json', { cache: 'no-store' });
    data = await resp.json();
  } catch (e) {
    metaEl.textContent = 'Konnte data/deals.json nicht laden.';
    return;
  }

  metaEl.textContent = data.generated_at
    ? `Zuletzt aktualisiert: ${new Date(data.generated_at).toLocaleString('de-DE')}`
    : 'Noch kein Lauf - config/routes.yaml anlegen und `python -m traveldeals.cli check` ausführen (oder auf den GitHub-Actions-Cron warten).';

  if (!data.routes || data.routes.length === 0) {
    routesEl.innerHTML = '<p class="empty">Keine Strecken konfiguriert.</p>';
    return;
  }

  routesEl.innerHTML = data.routes.map(route => `
    <div class="route">
      <h2>${route.origin} → ${route.destination}</h2>
      ${route.notes ? `<div class="notes">${route.notes}</div>` : ''}
      ${route.options.length === 0
        ? '<p class="empty">Keine Angebote gefunden.</p>'
        : route.options.map(opt => `
          <div class="option">
            <span class="price">${opt.total_price} ${opt.currency}</span>
            <span class="sites">· ${opt.mode} · ${opt.total_duration_hours}h · ${opt.booking_sites.join(', ')}</span>
            ${opt.is_error_fare ? '<span class="badge error">🔥 Fehlerpreis</span>' : ''}
            ${opt.is_price_drop ? '<span class="badge drop">📉 Preis gefallen</span>' : ''}
            ${opt.recommendations.length ? `<ul class="recs">${opt.recommendations.map(r => `<li>${r}</li>`).join('')}</ul>` : ''}
          </div>
        `).join('')}
    </div>
  `).join('');
}
load();
</script>
</body>
</html>
