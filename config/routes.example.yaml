# Kopiere diese Datei nach config/routes.yaml und trage deine eigenen
# Strecken ein. config/routes.yaml wird nicht eingecheckt (siehe .gitignore),
# damit deine persönlichen Reisepläne nicht im Repo landen.
routes:
  - id: berlin-barcelona-herbst
    origin: BER
    destination: BCN
    depart_date_from: 2026-09-10
    depart_date_until: 2026-09-14
    flex_days_before: 2       # wie viele Tage früher auch ok wären
    flex_days_after: 2        # wie viele Tage später auch ok wären
    min_nights: 4             # für Hotel/Flug+Hotel-Kombis
    max_nights: 7
    budget: 400               # Gesamtbudget in `currency`, leer = kein Limit
    currency: EUR
    max_duration_hours: 5     # maximale Reisezeit, leer = kein Limit
    priority: best_value      # cheapest | fastest | best_value
    modes:
      - flight
      - flight_hotel
    baggage:
      carry_on_only: false
      checked_bags: 1
      checked_bag_kg: 23
    rail:
      bahncard: null          # "25" | "50" | "100" | null
      deutschlandticket: false
    hotel:                    # nur relevant fuer hotel/*_hotel-Modi
      min_stars: 3
      min_rating: 7.5         # von 10
      max_distance_km: 3      # zu Zentrum/Bahnhof/Flughafen
      require_wifi: true
      require_breakfast: false
      require_free_cancellation: true
      require_parking: false
      require_air_conditioning: false
      require_pets_allowed: false
      require_pool_or_fitness: false
    transport:                # fuer flight/train/bus und deren Kombis
      direct_only: false
      require_wifi_onboard: false
      require_power_outlets: false
      min_punctuality_pct: null
      preferred_depart_time: null   # "HH:MM", z.B. "09:00" - null = egal, jede Uhrzeit ok
      depart_time_flex_minutes: 0   # Zeitfenster +/- um preferred_depart_time (nur falls gesetzt)
    low_cost_airlines_ok: true
    round_trip: true          # hin und zurück (nur relevant fuer flight/train/bus + deren Kombis)
    return_date: 2026-09-17   # nur gelesen wenn round_trip: true
    notes: "Herbstferien, Datum ist flexibel"

  - id: koeln-hamburg-bahn-oder-bus
    origin: Köln Hbf
    destination: Hamburg Hbf
    depart_date_from: 2026-10-01
    depart_date_until: 2026-10-01
    flex_days_before: 1
    flex_days_after: 1
    budget: 60
    currency: EUR
    max_duration_hours: 8
    priority: cheapest
    modes:
      - train_or_bus
    rail:
      bahncard: "25"
      deutschlandticket: false
    notes: "Kurztrip, Bahn oder Bus - Hauptsache günstig"
